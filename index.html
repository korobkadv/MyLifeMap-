<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="My Life Map - візуалізація життя. Дізнайтеся як виглядає ваше життя у тижнях, місяцях та роках.">
    <meta name="keywords" content="life map, візуалізація життя, календар життя, життєва статистика">
<meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <title data-i18n-key="appTitle"></title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="icon" href="./img/fav.ico">
</head>

<body>
    <header class="header" role="banner">
        <h1 class="header__logo">My Life Map</h1>
        <p class="header__description" data-i18n-key="appDescription"></p>
    </header>

    <main class="container" role="main">    
        <div class="layout">
            <!-- Ліва колонка з формою -->
            <section class="layout__form">
            <form class="form">
                <fieldset class="form__fieldset">
                    <legend class="form__legend visually-hidden" data-i18n-key="formLegend"></legend>

                    <div class="form__group">
                        <label for="dob" class="form__label" data-i18n-key="dobLabel"></label>
                        <input type="date" id="dob" name="dob" class="form__input" required aria-required="true">
                    </div>

                    <div class="form__group">
                        <label for="gender" class="form__label" data-i18n-key="genderLabel"></label>
                        <select id="gender" name="gender" class="form__select" required aria-required="true">
                            <option value="male" data-i18n-key="maleOption"></option>
                            <option value="female" data-i18n-key="femaleOption"></option>
                        </select>
                    </div>

                    <div class="form__group">
                        <label for="country" class="form__label" data-i18n-key="countryLabel"></label>
                        <select id="country" name="country" class="form__select" required aria-required="true"
                            aria-label="Оберіть регіон проживання">
                        </select>
                    </div>

                    <div class="form__group">
                        <label for="display-mode" class="form__label" data-i18n-key="displayModeLabel"></label>
                        <select id="display-mode" name="display-mode" class="form__select" required
                            aria-required="true">
                            <option value="days" data-i18n-key="daysOption"></option>
                            <option value="weeks" data-i18n-key="weeksOption"></option>
                            <option value="months" data-i18n-key="monthsOption"></option>
                            <option value="years" data-i18n-key="yearsOption"></option>
                        </select>
                    </div>

                    <button type="submit" class="form__submit" data-i18n-key="submitButton"></button>
                </fieldset>
            </form>
        </section>
        
        <!-- Права колонка зі статистикою -->
        <section id="stats-section" class="layout__stats" aria-hidden="true">
            <h2 class="visually-hidden" data-i18n-key="statsSectionTitle"></h2>

            <div id="capture-area">
                <h1 class="capture-header">My Life Map</h1>
                <div class="stats-summary">
                    <p><span data-i18n-key="statsLivedLabel">Прожито:</span> <strong id="stats-lived">-</strong> <span id="stats-lived-unit"></span></p>
                    <p><span data-i18n-key="statsTotalLabel">Загалом очікується:</span> <strong id="stats-total">-</strong> <span id="stats-total-unit"></span></p>
                    <p class="stats-summary__details">(<span data-i18n-key="statsBasedOn">На основі</span> <span id="stats-expectancy">-</span> <span data-i18n-key="statsYears">років</span> <span data-i18n-key="statsFor">для</span> <span id="stats-gender">-</span> <span data-i18n-key="statsIn">в</span> <span id="stats-country">-</span>)</p>
                </div>

                <div class="visualization-wrapper">
                    <div class="visualization" role="grid" aria-label="Візуалізація життя" data-i18n-aria-label="visualizationLabel">
                        <!-- Заповнюється через JavaScript -->
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="controls__button" data-i18n-key="saveButton"></button>
                <button class="controls__button" data-i18n-key="shareButton"></button>
            </div>
        </section>
        </div>
        </main>

    <footer class="footer" role="contentinfo">
        <div class="language-switcher">
            <button type="button" class="language-switcher__button" data-lang="ua">UA</button>
            <span class="language-switcher__separator">|</span>
            <button type="button" class="language-switcher__button" data-lang="en">EN</button>
        </div>
        <p class="footer__text" data-i18n-key="footerText"></p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="./js/main.js"></script>

    <!-- Модальне вікно для опцій експорту -->
    <div id="export-modal" class="modal" aria-hidden="true" role="dialog" aria-labelledby="export-modal-title">
        <div class="modal__content">
            <h3 id="export-modal-title" class="modal__title" data-i18n-key="exportOptionsTitle"></h3>
            <div class="modal__buttons">
                <button id="save-device-button" class="modal__button" data-i18n-key="saveToDeviceButton"></button>
                <button id="share-facebook-button" class="modal__button modal__button--facebook" data-i18n-key="shareFacebook"></button>
                <button id="share-twitter-button" class="modal__button modal__button--twitter" data-i18n-key="shareTwitter"></button>
                <button id="copy-link-modal-button" class="modal__button modal__button--copy" data-i18n-key="copyLinkButton"></button>
                <button id="cancel-export-button" class="modal__button modal__button--cancel" data-i18n-key="cancelButton"></button>
            </div>
        </div>
    </div>

    <!-- Прелоадер -->
    <div id="preloader" class="preloader" aria-hidden="true" role="status" aria-label="Завантаження...">
        <div class="spinner"></div>
    </div>

    <!-- Tooltip для візуалізації -->
    <div id="visualization-tooltip" class="tooltip" role="tooltip" aria-hidden="true"></div>

</body>

</html>
